<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign Up – BlogBOOHub</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="navbar"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Join BlogHub ✍️</h1>
    <p class="auth-subtitle">Create a free account and start writing today.</p>
    <div id="alert" class="hidden"></div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" type="text" placeholder="coolwriter123" autocomplete="username" maxlength="80"/>
      <small class="text-muted">At least 3 characters.</small>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" placeholder="Min. 6 characters" autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="bio">Short bio <span class="text-muted">(optional)</span></label>
      <input class="form-control" id="bio" type="text" placeholder="I write about tech, travel, and coffee…" maxlength="300"/>
    </div>

    <button class="btn btn-primary" id="registerBtn" style="width:100%;justify-content:center" onclick="handleRegister()">Create Account</button>

    <div class="auth-divider">— or —</div>
    <p class="text-center text-muted">Already have an account? <a href="login.html">Log in here</a></p>
  </div>
</div>

<div id="toast"></div>
<script src="js/api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    renderNavbar();
    if (Auth.isLoggedIn()) { window.location.href = "index.html"; return; }
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") handleRegister(); });
  });

  async function handleRegister() {
    const username = document.getElementById("username").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const bio      = document.getElementById("bio").value.trim();
    const btn      = document.getElementById("registerBtn");

    if (!username || !email || !password) { showAlert("Username, email, and password are required.", "error"); return; }
    if (username.length < 3) { showAlert("Username must be at least 3 characters.", "error"); return; }
    if (password.length < 6) { showAlert("Password must be at least 6 characters.", "error"); return; }
    if (!email.includes("@")) { showAlert("Please enter a valid email address.", "error"); return; }

    btn.disabled = true; btn.textContent = "Creating account…"; clearAlert();
    const { ok, data } = await apiRequest("/register", "POST", { username, email, password, bio });
    btn.disabled = false; btn.textContent = "Create Account";

    if (ok) { Auth.save(data.token, data.user); showToast(`Welcome, ${data.user.username} 🎉`, "success"); setTimeout(() => { window.location.href = "index.html"; }, 900); }
    else { showAlert(data.error || "Registration failed.", "error"); }
  }

  function showAlert(msg, type) { const el = document.getElementById("alert"); el.className = `alert alert-${type}`; el.textContent = msg; el.classList.remove("hidden"); }
  function clearAlert() { document.getElementById("alert").classList.add("hidden"); }
</script>
</body>
</html>
