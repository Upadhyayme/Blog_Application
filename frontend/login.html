<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login – BlogBOOHub</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="navbar"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back 👋</h1>
    <p class="auth-subtitle">Log in to continue writing and reading.</p>
    <div id="alert" class="hidden"></div>

    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center" onclick="handleLogin()">Log In</button>

    <div class="auth-divider">— or —</div>
    <p class="text-center text-muted">Don't have an account? <a href="register.html">Create one free</a></p>
  </div>
</div>

<div id="toast"></div>
<script src="js/api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    renderNavbar();
    if (Auth.isLoggedIn()) { window.location.href = "index.html"; return; }
    ["email","password"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
    });
  });

  async function handleLogin() {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const btn      = document.getElementById("loginBtn");
    if (!email || !password) { showAlert("Please fill in all fields.", "error"); return; }
    btn.disabled = true; btn.textContent = "Logging in…"; clearAlert();
    const { ok, data } = await apiRequest("/login", "POST", { email, password });
    btn.disabled = false; btn.textContent = "Log In";
    if (ok) { Auth.save(data.token, data.user); showToast(`Welcome back, ${data.user.username}! 🎉`, "success"); setTimeout(() => { window.location.href = "index.html"; }, 900); }
    else { showAlert(data.error || "Login failed.", "error"); }
  }

  function showAlert(msg, type) { const el = document.getElementById("alert"); el.className = `alert alert-${type}`; el.textContent = msg; el.classList.remove("hidden"); }
  function clearAlert() { document.getElementById("alert").classList.add("hidden"); }
</script>
</body>
</html>
